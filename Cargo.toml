[package]
name = "slipcase"
version = "0.1.0"
edition = "2021"
description = "A fast, native 3D game launcher: cases, discs and shelves, in the spirit of the Aurora dashboard."
license = "MIT"

[features]
default = ["gamepad", "wayland"]
# Native Wayland (needs libwayland-dev + libxkbcommon-dev at build time on Linux; X11 works without).
wayland = ["bevy/wayland"]
# Controller support (needs libudev-dev at build time on Linux).
gamepad = ["bevy/bevy_gilrs"]

[dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
crossbeam-channel = "0.5"
fontdue = "0.9"
# Pure-Rust-ish HTTP client using rustls, so nothing to link dynamically.
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
# Reads the LaunchBox Games Database dump (spines, backs, disc art, logos, fanart).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Native file picker ("add games"); talks to the desktop portal on Linux, no GTK needed.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Copy / paste in the settings text fields and search (X11, Wayland, Windows, macOS).
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
rapier3d = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Pointer position, to open on the screen the mouse is on.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Pointer position on X11 (loads libX11 at run time, like winit does).
x11-dl = "2.21"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
