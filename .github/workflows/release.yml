# Builds Slipcase for Linux and Windows and publishes a GitHub release when a version tag
# (v0.1.0, v0.2.0, ...) is pushed. Run it by hand from the Actions tab to just build.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

jobs:
  linux:
    # An older Ubuntu, so the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo test --release
      - run: cargo build --release
      - run: |
          mkdir -p dist
          cp target/release/slipcase dist/slipcase-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/slipcase-linux-x86_64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/slipcase.exe dist/slipcase-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/slipcase-windows-x86_64.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: chmod +x dist/slipcase-linux-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
