# Builds Slipcase for Linux, Windows and macOS and publishes a GitHub release when a version
# tag (v0.1.0, v0.2.0, ...) is pushed. Run it by hand from the Actions tab to just build.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

jobs:
  build:
    strategy:
      # One platform failing still lets the others finish and be released.
      fail-fast: false
      matrix:
        include:
          # Older Ubuntu, so the Linux binaries run on older glibc versions too.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, file: Slipcase-x86_64.AppImage }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, file: Slipcase-aarch64.AppImage }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: slipcase-windows-x86_64.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, file: slipcase-windows-arm64.exe }
          # Apple Silicon runner; the Intel build is cross-compiled there (Xcode has both).
          - { os: macos-15, target: aarch64-apple-darwin, file: slipcase-macos-arm64 }
          - { os: macos-15, target: x86_64-apple-darwin, file: slipcase-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libwayland-dev libxkbcommon-dev
      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --release
      - name: AppImage
        if: runner.os == 'Linux'
        run: ./build.sh appimage
      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Collect
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          bin=target/${{ matrix.target }}/release/slipcase
          [[ -f $bin.exe ]] && bin=$bin.exe
          cp "$bin" "dist/${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          if-no-files-found: error
          path: dist/${{ matrix.file }}

  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: chmod +x dist/*.AppImage dist/slipcase-macos-* 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
